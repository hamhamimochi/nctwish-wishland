
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WISH LAND｜Discord</title>
<style>
  
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans TC", sans-serif;
  background: #313338;
  color: #f2f3f5;
  width: 100%;
  overflow-x: hidden;
}

.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.server-bar {
  width: 72px;
  background: #1e1f22;
  padding: 12px;
}

.server-icon {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: #eb20b5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  margin-bottom: 12px;
}

.sidebar {
  width: 240px;
  background: #2b2d31;
  padding: 20px 12px;
  overflow-y: auto;
}

.server-name {
  font-size: 20px;
  font-weight: bold;
  margin: 4px 8px 24px;
}

.category {
  color: #949ba4;
  font-size: 12px;
  font-weight: bold;
  margin: 20px 8px 8px;
}

.channel {
  padding: 9px 10px;
  border-radius: 5px;
  color: #b5bac1;
  margin-bottom: 4px;
}

.channel.active {
  background: #404249;
  color: #ffffff;
}

.chat-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.chat-header {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid #26272b;
  font-size: 20px;
  font-weight: bold;
}

 .chat-messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
}

.message {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
}
.message:hover {
  background: #2e3035;
  border-radius: 4px;
}

.avatar {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #eb20b5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #fff;

}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

.message-content {
  min-width: 0;
}

.message-info {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}

.username {
  font-weight: bold;
  color: #677C89;
}

.timestamp {
  font-size: 12px;
  color: #949ba4;
  font-weight: 400;
}

.message-text {
  color: #dbdee1;
  font-size: 14px;
  line-height: 1.5;
}

@media (max-width: 600px) {
  .server-bar {
    display: none;
  }

  .sidebar {
    width: 160px;
  }

  .chat-header {
    padding: 0 12px;
  }
}

.message-image {
  display: block;
  max-width: min(400px, 100%);
  max-height: 400px;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
  margin-top: 8px;
  
}

.ascii-art {
  white-space: pre-wrap;
  font-family: monospace;
  font-size: 14px;
  line-height: 1.5;
}
.menu-toggle {
  display: none;
}

@media (max-width: 600px) {
  .menu-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: white;
    font-size: 22px;
    cursor: pointer;
    margin-right: 12px;
  }

  .app {
    position: relative;
    overflow: hidden;
  }

  .sidebar {
    display: none;
  }

  .sidebar.open {
    display: flex;
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 220px;
    z-index: 10;
    background: #2b2d31;
    flex-direction: column;
    align-items: stretch;
    overflow-y: auto;
  }

  .chat-area {
    min-width: 0;
    width: 100%;
  }
}
</style>
</head>
<body>
  
<body>
  <div class="app">
    <aside class="server-bar">
      <div class="server-icon">W</div>
    </aside>

    <aside class="sidebar">
      <div class="server-name">WISH LAND⌄</div>

      <div class="category">Confused Boy</div>
      <div class="channel active"># 다들뭐해</div>

      <div class="category">Lover Boy</div>
      <div class="channel"># SION♡</div>
      <div class="channel"># RIKU♡</div>
      <div class="channel"># YUSHI♡</div>
      <div class="channel"># JAEHEE♡</div>
      <div class="channel"># RYO♡</div>
      <div class="channel"># SAKUYA♡</div>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
  <button class="menu-toggle" id="menu-toggle" aria-label="開啟選單">☰</button>
  # 다들뭐해
</header>

      <section class="chat-messages">
        <div id="markdown-messages"></div>
  
</section>
    </main>
  </div>

<script>
  async function loadMarkdown() {
    const response = await fetch(
      "./다들뭐해 3e6ae0090c798034ba3fc6e0aa09aabb.md"
    );

    if (!response.ok) {
      throw new Error("Markdown 檔案讀取失敗：" + response.status);
    }

    const markdown = await response.text();
    const container = document.getElementById("markdown-messages");

    container.replaceChildren();

    // 找出「成員名稱＋日期時間」的標題行
    const headerRegex =
      /^\s*.*?\b([A-Z]+)\s+(20\d{2}年[^*\n]+).*$/gm;

    const headers = [...markdown.matchAll(headerRegex)];

    headers.forEach((header, index) => {
      const username = header[1];
      const timestamp = header[2].trim().replace(/\\?\*+$/g, "").trim();

      const start = header.index + header[0].length;
      const end = index + 1 < headers.length
        ? headers[index + 1].index
        : markdown.length;

      const content = markdown.slice(start, end).trim();
      if (!content) return;

      const message = document.createElement("div");
      message.className = "message";

      
      const avatar = document.createElement("div");
      avatar.className = "avatar";

      const avatarImages = {
        "SION": "sion-lover-boy.JPG",
        "RIKU": "riku-lover-boy.JPG",
        "YUSHI": "yushi-lover-boy.JPG",
        "JAEHEE": "jaehee-lover-boy.JPG",
        "RYO": "ryo-lover-boy.JPG",
        "SAKUYA": "sakuya-lover-boy.JPG"
      };
      const avatarFile = avatarImages[username.toUpperCase()];
      if (avatarFile) {
        const avatarImg = document.createElement("img");
        avatarImg.src = `./${avatarFile}`;
        avatarImg.alt = username;
        avatar.append(avatarImg);
      } else {
        avatar.textContent = username.charAt(0);
      }


      const messageContent = document.createElement("div");
      messageContent.className = "message-content";

      const info = document.createElement("div");
      info.className = "message-info";

      const name = document.createElement("span");
      name.className = "username";
      name.textContent = username;

      const time = document.createElement("span");
      time.className = "timestamp";
      time.textContent = timestamp;

      info.append(name, time);
      messageContent.append(info);

      // 依原始順序處理圖片與文字連結
      const tokenRegex =
        /!\[([^\]]*)\]\(([^)\n]+)\)|\[([\s\S]*?)\]\((https?:\/\/[^)\s]+)\)/g;

      let lastIndex = 0;
      let match;

      function addText(text) {
        text = text.trim();
        if (!text) return;

        const textElement = document.createElement("div");
        textElement.className = "message-text";

        // 保留文字藝術的換行與空白
        textElement.style.whiteSpace = "pre-wrap";
        textElement.textContent = text;

        messageContent.append(textElement);
      }

      while ((match = tokenRegex.exec(content)) !== null) {
        addText(content.slice(lastIndex, match.index));

        if (match[1] !== undefined) {
  const fileName = match[2].trim();
  const fileExtension = fileName.split(".").pop().toLowerCase();

  if (["mov", "mp4", "webm"].includes(fileExtension)) {
    const video = document.createElement("video");
    video.className = "message-image";
    video.src = fileName;
    video.controls = true;
    video.preload = "metadata";
    messageContent.append(video);
  } else {
    const image = document.createElement("img");
    image.className = "message-image";
    image.src = fileName;
    image.alt = match[1] || "聊天圖片";
    messageContent.append(image);
  }
} else {
  const linkText = match[3];
  const linkUrl = match[4];

  // 如果連結文字中包含圖片 Markdown，建立可點擊的預覽圖
  const imageMatch = linkText.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);

  if (imageMatch) {
    const image = document.createElement("img");
    image.className = "message-image";
    image.src = imageMatch[2].trim();
    image.alt = imageMatch[1] || "聊天圖片";

    const link = document.createElement("a");
    link.href = linkUrl;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.append(image);

    messageContent.append(link);
  } else if (linkUrl.includes("drive.google.com/file/d/1LgVqW2z1ur3rzaysvCNsV3KIzHIhDsy0")) {
    const image = document.createElement("img");
    image.className = "message-image";
    image.src = "./이게뭔데.gif";
    image.alt = "이게뭔데.gif";
    messageContent.append(image);
  } else {
    const link = document.createElement("a");
    link.href = linkUrl;
    link.textContent = linkText;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.style.color = "#00a8fc";
    link.style.textDecoration = "none";
    messageContent.append(link);
  }
}

        lastIndex = tokenRegex.lastIndex;
      }

      addText(content.slice(lastIndex));

      message.append(avatar, messageContent);
      container.append(message);
    });

    console.log("解析到的成員訊息數量：", headers.length);
  }

  loadMarkdown().catch(error => {
    console.error(error);
  });
const menuToggle = document.getElementById("menu-toggle");
const sidebar = document.querySelector(".sidebar");

menuToggle.addEventListener("click", () => {
  sidebar.classList.toggle("open");
});

document.querySelectorAll(".sidebar .channel").forEach((channel) => {
  channel.addEventListener("click", () => {
    sidebar.classList.remove("open");
  });
});
</script>

</body>
</html>
